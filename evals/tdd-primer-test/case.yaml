schema_version: "1.1"
name: tdd-primer-test
description: Con la skill tdd, el plan empieza por un test que falla y no por la implementación.
tags: [skill, tdd]
runs: 1
execution:
  prompt: |
    I need a function slugify(title) that turns a post title into a URL slug. Load the tdd skill of the cc-improved plugin and tell me, in a short numbered list, how you would build it. Do not write any file.
  model: claude-haiku-5-5
  max_turns: 6
  timeout_seconds: 120
  allowed_tools: [Skill, Read, Glob]
graders:
  - name: skill-tdd
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?tdd"'
  - name: test-primero
    type: regex
    pattern: "(failing|fails?|red)\\b"
    flags: i
  - name: no-escribe-archivos
    type: tool_used
    tool: Write
    min: 0
    max: 0
    arm: both
